[project]
name = "anri"
version = "0.1.0"
description = "Assistente AI personale con controllo vocale, 100% locale"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = stile PEP 8, F = errori veri (variabili inutilizzate, import mancanti...),
# I = ordine degli import, B = bug comuni, UP = sintassi Python moderna,
# SIM = semplificazioni suggerite
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
